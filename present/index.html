<script>
try{ var m = document.cookie.match(/(?:^|; )hl_theme=(dark|light|system)/), t = m ? m[1] : JSON.parse(localStorage.getItem("hl.theme"));
     if(t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<link rel="stylesheet" href="/office/office.css?b=20261108a">
<style>
:root{--a1:#ea580c}
.work{flex:1;display:flex;min-height:0}
.rail{width:200px;flex:none;overflow:auto;background:var(--tool);border-right:1px solid var(--rule);padding:10px 10px 30px;display:flex;flex-direction:column;gap:10px}
.thumb{position:relative;display:flex;gap:6px;align-items:flex-start;border:0;background:transparent;padding:0;text-align:left}
.thumb .no{font:600 .75rem var(--ui);color:var(--soft);width:16px;padding-top:4px;text-align:right;flex:none}
.thumb .mini{width:160px;height:90px;border-radius:8px;overflow:hidden;position:relative;border:2px solid var(--rule);background:#fff;flex:none}
.thumb[aria-current="true"] .mini{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 25%,transparent)}
.thumb .mini > .slide{transform:scale(.16667);transform-origin:0 0;pointer-events:none}
.railbtns{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:-10px;background:var(--tool);padding:4px 0;z-index:2}
.railbtns .tb{border:1px solid var(--rule);background:var(--card)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.stagewrap{flex:1;display:grid;place-items:center;overflow:hidden;padding:20px;min-height:0;position:relative}
.stage{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.12),0 18px 44px -16px rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.notes{flex:none;height:86px;border-top:1px solid var(--rule);background:var(--card);display:flex}
.notes textarea{flex:1;border:0;background:transparent;padding:10px 16px;resize:none;font:14px/1.45 var(--ui);outline:none}
@media (max-width:760px){ .rail{width:120px} .thumb .mini{width:96px;height:54px} .thumb .mini > .slide{transform:scale(.1)} .notes{height:64px} }

.themegal{flex-wrap:nowrap!important;overflow-x:auto;max-width:560px;gap:6px!important}
.thm{flex:none;width:92px;height:58px;border-radius:9px;border:2px solid var(--rule);position:relative;padding:4px 6px;text-align:left;overflow:hidden}
.thm b{font:700 18px var(--ui)}.thm small{position:absolute;left:6px;bottom:3px;font:600 9px var(--ui);opacity:.85}
.thm i{position:absolute;right:6px;top:8px;width:16px;height:16px;border-radius:50%}
.thm[aria-pressed="true"]{border-color:var(--a1);box-shadow:0 0 0 2px color-mix(in srgb,var(--a1) 35%,transparent)}
.sorter{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:24px;overflow:auto;flex:1;align-content:start}
.sorter .scard{border:3px solid var(--rule);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:16/9;background:#fff}
.sorter .scard[aria-current="true"]{border-color:var(--a1)}
.sorter .scard .slide{transform-origin:0 0;pointer-events:none}
.sorter .scard span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font:700 12px var(--ui);padding:2px 8px;border-radius:999px}
.thumb.hid .mini,.sorter .scard.hid{opacity:.4}
/* a slide is always 960 x 540 units inside, then scaled */
.slide{position:relative;width:960px;height:540px;overflow:hidden;font-family:Calibri,Carlito,"Segoe UI",sans-serif}
.el{position:absolute;box-sizing:border-box}
.el.text{padding:6px 10px;line-height:1.15;outline:none;overflow:hidden;word-wrap:break-word}
.el.text ul,.el.text ol{margin:0;padding-left:1.15em}
.el.text li{margin:.25em 0}
.el.text p,.el.text div{margin:0}
.el.text:empty::before{content:attr(data-ph);opacity:.45}
.el.img img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.el.shape svg{width:100%;height:100%;display:block;overflow:visible}
.edit .el{cursor:move}
.edit .el.text[contenteditable="true"]{cursor:text;outline:2px dashed rgba(234,88,12,.7);outline-offset:-2px}
.edit .el.text:not([contenteditable="true"]):empty{outline:1px dashed rgba(127,127,127,.6);outline-offset:-1px}
.selbox{position:absolute;border:2px solid #ea580c;pointer-events:none;z-index:50}
.selbox i{position:absolute;width:14px;height:14px;background:#fff;border:2px solid #ea580c;border-radius:50%;margin:-8px 0 0 -8px;pointer-events:auto;touch-action:none}
.guide{position:absolute;background:#ec4899;z-index:49;pointer-events:none}
.ribbon .tb.wide{font-size:.84rem}
.thpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thpick button{border:2px solid var(--rule);border-radius:12px;padding:0;overflow:hidden;background:none;aspect-ratio:16/9;position:relative}
.thpick button[aria-pressed="true"]{border-color:var(--a1)}
.thpick span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.05rem}

/* presenting */
#show{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;cursor:none;touch-action:none}
#show.mouse{cursor:default}
#show .slide{box-shadow:none}
#show .bar{position:fixed;bottom:14px;right:18px;color:rgba(255,255,255,.65);font:600 14px var(--ui);display:flex;gap:10px;align-items:center;opacity:0;transition:opacity .3s}
#show.mouse .bar{opacity:1}
#show .bar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:6px 12px}
.t-fade{animation:tfade .5s ease both}.t-push{animation:tpush .55s cubic-bezier(.2,.8,.2,1) both}.t-zoom{animation:tzoom .5s cubic-bezier(.2,.8,.2,1) both}
.t-back.t-push{animation-name:tpushb}
@keyframes tfade{from{opacity:0}}@keyframes tpush{from{transform:translateX(30%);opacity:0}}@keyframes tpushb{from{transform:translateX(-30%);opacity:0}}@keyframes tzoom{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.t-fade,.t-push,.t-zoom{animation:none}}

#printArea{display:none}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  body{display:block;overflow:visible;background:#fff}
  body > *:not(#printArea){display:none!important}
  body::before{display:none!important}
  #printArea{display:block}
  #printArea .pg{width:13.333in;height:7.5in;overflow:hidden;break-after:page;page-break-after:always}
  #printArea .slide{transform:scale(1.3333);transform-origin:0 0}
}
</style>

<body>
<header class="top">
  <a class="brand" href="/" title="All the Suite apps"><i aria-hidden="true">🎞️</i><span>Present</span></a>
  <input class="title-in" id="title" value="Untitled presentation" aria-label="Presentation name" maxlength="120">
  <span class="status" id="status" aria-live="polite"></span>
  <span class="sp"></span>
  <button class="tbtn" id="playBtn" type="button" style="background:var(--a1)">▶<span class="lbl"> Present</span></button>
  <button class="tbtn" id="filesBtn" type="button">📁<span class="lbl"> Files</span></button>
  <button class="tbtn" id="themeBtn" type="button"></button>
  <a class="tbtn" href="https://civilinitiatives.org/">Launchpad</a>
</header>

<nav class="tabsbar" role="tablist" aria-label="Ribbon">
  <button type="button" class="file" id="fileTab">File</button>
  <button type="button" role="tab" data-tab="home" aria-selected="true">Home</button>
  <button type="button" role="tab" data-tab="insert" aria-selected="false">Insert</button>
  <button type="button" role="tab" data-tab="design" aria-selected="false">Design</button>
  <button type="button" role="tab" data-tab="trans" aria-selected="false">Transitions</button>
  <button type="button" role="tab" data-tab="show" aria-selected="false">Slide Show</button>
  <button type="button" role="tab" data-tab="view" aria-selected="false">View</button>
</nav>

<!-- HOME -->
<div class="ribbon" data-panel="home" role="tabpanel" aria-label="Home">
  <div class="rg"><div class="row">
      <div style="display:flex;flex-direction:column;gap:2px">
        <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button class="tb" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      </div>
      <button class="big" id="dupBtn" title="Duplicate (Ctrl+D)"><i>⧉</i>Duplicate</button>
    </div><div class="gl">Clipboard</div></div>
  <div class="rg"><div class="row">
      <div class="menuwrap"><button class="big" id="newBtn" aria-haspopup="true" title="New slide (Ctrl+M)"><i>＋</i>New<br>slide ▾</button>
      <div class="menu" id="newMenu" hidden style="left:0;right:auto">
        <button type="button" data-lay="title">🅃<span>Title slide<small>Big title and a subtitle</small></span></button>
        <button type="button" data-lay="content">☰<span>Title and content<small>A heading and bullet points</small></span></button>
        <button type="button" data-lay="two">◫<span>Two content<small>Compare two things</small></span></button>
        <button type="button" data-lay="picture">🖼<span>Title and picture<small>A heading with room for a picture</small></span></button>
        <button type="button" data-lay="section">§<span>Section header<small>Start a new part</small></span></button>
        <button type="button" data-lay="blank">▢<span>Blank<small>Start from nothing</small></span></button>
      </div></div>
      <button class="big" id="sDel2" title="Delete this slide"><i>🗑</i>Delete<br>slide</button>
    </div><div class="gl">Slides</div></div>
  <div class="rg" id="textTools"><div class="row">
      <button class="tb" data-cmd="bold" aria-label="Bold" title="Bold"><b>B</b></button>
      <button class="tb" data-cmd="italic" aria-label="Italic" title="Italic"><i>I</i></button>
      <button class="tb" data-cmd="underline" aria-label="Underline" title="Underline"><u>U</u></button>
      <button class="tb" data-cmd="strikeThrough" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
    </div><div class="row">
      <button class="tb" id="szUp" aria-label="Bigger text" title="Bigger text">A<sup>+</sup></button>
      <button class="tb" id="szDown" aria-label="Smaller text" title="Smaller text">A<sup>−</sup></button>
      <label class="tb colorbtn" title="Colour (text or shape)">A<span class="bar" id="colBar" style="background:#ea580c"></span><input type="color" id="colIn" value="#ea580c" aria-label="Colour"></label>
    </div><div class="gl">Font</div></div>
  <div class="rg"><div class="row">
      <button class="tb" data-cmd="insertUnorderedList" aria-label="Bullets" title="Bullets">•≡</button>
      <button class="tb" data-cmd="insertOrderedList" aria-label="Numbering" title="Numbering">1≡</button>
    </div><div class="row">
      <button class="tb" data-alg="left" aria-label="Align left" title="Align left">⫷</button>
      <button class="tb" data-alg="center" aria-label="Centre" title="Centre">☰</button>
      <button class="tb" data-alg="right" aria-label="Align right" title="Align right">⫸</button>
    </div><div class="gl">Paragraph</div></div>
  <div class="rg"><div class="row">
      <div class="menuwrap"><button class="big" id="shapeBtn" aria-haspopup="true"><i>⬟</i>Shapes ▾</button>
        <div class="menu" id="shapeMenu" hidden style="left:0;right:auto;min-width:180px">
          <button type="button" data-shape="rect">▬<span>Rectangle</span></button>
          <button type="button" data-shape="round">▢<span>Rounded box</span></button>
          <button type="button" data-shape="ellipse">⬤<span>Circle</span></button>
          <button type="button" data-shape="triangle">▲<span>Triangle</span></button>
          <button type="button" data-shape="star">★<span>Star</span></button>
          <button type="button" data-shape="arrow">➜<span>Arrow</span></button>
          <button type="button" data-shape="line">―<span>Line</span></button>
        </div></div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <button class="tb wide" id="fwdBtn" title="Bring to front">⇡ Front</button>
        <button class="tb wide" id="backBtn" title="Send to back">⇣ Back</button>
      </div>
      <button class="big" id="delBtn" title="Delete (Del)"><i>✕</i>Delete</button>
    </div><div class="gl">Drawing</div></div>
</div>

<!-- INSERT -->
<div class="ribbon" data-panel="insert" role="tabpanel" aria-label="Insert" hidden>
  <div class="rg"><div class="row">
      <button class="big" id="newBtn2"><i>＋</i>New<br>slide</button>
    </div><div class="gl">Slides</div></div>
  <div class="rg"><div class="row">
      <label class="big" title="Picture"><i>🖼</i>Pictures<input type="file" id="imgIn" accept="image/*" hidden></label>
    </div><div class="gl">Images</div></div>
  <div class="rg"><div class="row" id="shapeRow">
      <button class="big" data-shape="rect"><i>▬</i>Rectangle</button>
      <button class="big" data-shape="ellipse"><i>⬤</i>Circle</button>
      <button class="big" data-shape="arrow"><i>➜</i>Arrow</button>
      <button class="big" data-shape="star"><i>★</i>Star</button>
      <button class="big" data-shape="line"><i>―</i>Line</button>
    </div><div class="gl">Shapes</div></div>
  <div class="rg"><div class="row">
      <button class="big" id="addText"><i>🅰</i>Text box</button>
      <button class="big" id="insDate"><i>📅</i>Date</button>
    </div><div class="gl">Text</div></div>
</div>

<!-- DESIGN -->
<div class="ribbon" data-panel="design" role="tabpanel" aria-label="Design" hidden>
  <div class="rg"><div class="row themegal"><button type="button" class="thm" data-theme="classic" title="Classic" style="background:linear-gradient(135deg,#ffffff,#ffffff);color:#1f2937"><b>Aa</b><i style="background:#2563eb"></i><small>Classic</small></button><button type="button" class="thm" data-theme="midnight" title="Midnight" style="background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#ffffff"><b>Aa</b><i style="background:#38bdf8"></i><small>Midnight</small></button><button type="button" class="thm" data-theme="aurora" title="Aurora" style="background:linear-gradient(135deg,#4338ca,#db2777);color:#ffffff"><b>Aa</b><i style="background:#fde047"></i><small>Aurora</small></button><button type="button" class="thm" data-theme="glass" title="Glass" style="background:linear-gradient(135deg,#dbeafe,#fae8ff);color:#1e1b4b"><b>Aa</b><i style="background:#7c3aed"></i><small>Glass</small></button><button type="button" class="thm" data-theme="forest" title="Forest" style="background:linear-gradient(135deg,#ecfdf5,#ecfdf5);color:#065f46"><b>Aa</b><i style="background:#16a34a"></i><small>Forest</small></button><button type="button" class="thm" data-theme="sunset" title="Sunset" style="background:linear-gradient(135deg,#f97316,#be123c);color:#ffffff"><b>Aa</b><i style="background:#fde68a"></i><small>Sunset</small></button><button type="button" class="thm" data-theme="paper" title="Paper" style="background:linear-gradient(135deg,#fdf6e3,#fdf6e3);color:#7c2d12"><b>Aa</b><i style="background:#b45309"></i><small>Paper</small></button><button type="button" class="thm" data-theme="space" title="Space" style="background:linear-gradient(135deg,#000000,#312e81);color:#e0e7ff"><b>Aa</b><i style="background:#f472b6"></i><small>Space</small></button></div><div class="gl">Themes</div></div>
  <div class="rg"><div class="row">
      <button class="big" id="designBtn"><i>🎨</i>All<br>themes</button>
      <label class="big" title="Background colour for this slide">🖌<span>Background</span><input type="color" id="bgIn" value="#ffffff" hidden></label>
      <button class="big" id="bgReset"><i>↺</i>Reset<br>background</button>
    </div><div class="gl">Customise</div></div>
</div>

<!-- TRANSITIONS -->
<div class="ribbon" data-panel="trans" role="tabpanel" aria-label="Transitions" hidden>
  <div class="rg"><div class="row">
      <button class="big" data-trans="none"><i>⛶</i>None</button>
      <button class="big" data-trans="fade"><i>🌫</i>Fade</button>
      <button class="big" data-trans="push"><i>⇨</i>Push</button>
      <button class="big" data-trans="zoom"><i>🔍</i>Zoom</button>
    </div><div class="gl">Transition to this slide</div></div>
  <div class="rg"><div class="row">
      <button class="big" id="transPrev"><i>▶</i>Preview</button>
      <button class="big" id="transAll"><i>⧉</i>Apply<br>to all</button>
    </div><div class="gl">Timing</div></div>
</div>

<!-- SLIDE SHOW -->
<div class="ribbon" data-panel="show" role="tabpanel" aria-label="Slide Show" hidden>
  <div class="rg"><div class="row">
      <button class="big" id="playFirst" title="F5"><i>▶</i>From<br>beginning</button>
      <button class="big" id="playCur" title="Shift+F5"><i>⏵</i>From current<br>slide</button>
    </div><div class="gl">Start slide show</div></div>
  <div class="rg"><div class="row">
      <button class="big" id="hideSlide" aria-pressed="false"><i>🙈</i>Hide<br>slide</button>
    </div><div class="gl">Set up</div></div>
</div>

<!-- VIEW -->
<div class="ribbon" data-panel="view" role="tabpanel" aria-label="View" hidden>
  <div class="rg"><div class="row">
      <button class="big" id="viewNormal" aria-pressed="true"><i>▭</i>Normal</button>
      <button class="big" id="viewSorter" aria-pressed="false"><i>▦</i>Slide<br>sorter</button>
    </div><div class="gl">Presentation views</div></div>
  <div class="rg"><div class="row">
      <button class="big" id="notesBtn" aria-pressed="true"><i>🗒</i>Notes</button>
    </div><div class="gl">Show</div></div>
</div>

<div class="work">
  <aside class="rail" aria-label="Slides">
    <div class="railbtns">
      <button class="tb" id="sDup" title="Duplicate slide" aria-label="Duplicate slide">⧉</button>
      <button class="tb" id="sUp" title="Move slide up" aria-label="Move slide up">↑</button>
      <button class="tb" id="sDown" title="Move slide down" aria-label="Move slide down">↓</button>
      <button class="tb" id="sDel" title="Delete slide" aria-label="Delete slide">🗑</button>
    </div>
    <div id="thumbs" style="display:flex;flex-direction:column;gap:10px"></div>
  </aside>
  <section class="main">
    <div class="stagewrap" id="stagewrap"><div class="stage" id="stage"></div></div>
    <div class="notes"><textarea id="notes" placeholder="Speaker notes - only you see these" aria-label="Speaker notes"></textarea></div>
  </section>
</div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>

<script src="/office/jszip.min.js"></script>
<script src="/office/office.js?b=20261109b"></script>
<script src="/office/live.js?b=20261109b"></script>
<script src="/present/pptx.js?b=20261107a"></script>
<script src="/present/present.js?b=20261107a"></script>
</body>
