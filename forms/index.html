<link rel="stylesheet" href="/office/office.css?b=20261108a">
<style>
:root{--a1:#9333ea}
body{overflow:auto;display:block}
.top{position:sticky;top:0}
main{max-width:780px;margin:0 auto;padding:20px 16px 90px}
.tabs2{display:flex;gap:6px;justify-content:center;margin:4px 0 18px}
.tabs2 button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:700}
.tabs2 button[aria-selected="true"]{background:var(--a1);border-color:var(--a1);color:#fff}
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px 20px;margin-bottom:14px}
.headcard{border-top:8px solid var(--a1)}
.headcard input.ft{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;font:700 1.7rem var(--ui);padding:4px 0 8px;outline:none;color:var(--ink);box-sizing:border-box}
.headcard textarea{width:100%;border:0;background:transparent;font:inherit;color:var(--soft);resize:vertical;outline:none;margin-top:8px;box-sizing:border-box}
.q{position:relative}
.q.sel{border-left:6px solid var(--a1)}
.qrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.qrow input.qt{flex:1 1 300px;min-width:0;border:0;border-bottom:1px solid var(--rule);background:var(--tool);padding:10px 12px;font:600 1rem var(--ui);border-radius:10px 10px 0 0;outline:none}
.qrow select{height:42px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:0 8px}
.opts{margin:12px 0 4px;display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:center}
.opt input.ot{flex:1;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:6px 2px;outline:none;font:inherit}
.opt .mark{width:18px;height:18px;border:2px solid var(--soft);flex:none}
.opt .mark.round{border-radius:50%}.opt .mark.sq{border-radius:4px}
.opt button,.qfoot button{border:0;background:transparent;border-radius:999px;padding:6px 10px;color:var(--soft)}
.opt button:hover,.qfoot button:hover{background:var(--hover)}
.opt label.correct{font-size:.78rem;color:#15803d;display:flex;gap:4px;align-items:center;white-space:nowrap}
.qfoot{display:flex;gap:6px;align-items:center;justify-content:flex-end;border-top:1px solid var(--rule);margin-top:12px;padding-top:8px;flex-wrap:wrap}
.qfoot label{display:flex;gap:6px;align-items:center;font-size:.88rem;margin-right:auto}
.keyrow{margin-top:10px;font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#15803d}
.keyrow input{flex:1;min-width:160px;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--tool)}
.addbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 18px}
.setgrid{display:grid;gap:10px}
.setgrid label{display:flex;gap:10px;align-items:center}
.setgrid input[type=checkbox]{width:20px;height:20px;accent-color:var(--a1)}
.preview-pill{display:inline-block;background:var(--on);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-bottom:8px}
/* answering */
.ans .qtext{font-weight:700;margin:0 0 10px}
.ans .req{color:#dc2626}
.ans label.choice{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.ans label.choice:hover{background:var(--hover)}
.ans input[type=radio],.ans input[type=checkbox]{width:20px;height:20px;accent-color:var(--a1)}
.ans input[type=text],.ans input[type=date],.ans textarea,.ans select{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--tool);font:inherit;box-sizing:border-box}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{flex:1;min-width:40px;text-align:center;border:1px solid var(--rule);border-radius:10px;padding:8px 0;cursor:pointer}
.scale input{display:none}
.scale label:has(input:checked){background:var(--a1);color:#fff;border-color:var(--a1)}
.good{color:#15803d;font-weight:700}.bad{color:#dc2626;font-weight:700}
.score{font:800 3rem var(--ui);color:var(--a1);text-align:center;margin:8px 0}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(80px,180px) 1fr 44px;gap:8px;align-items:center;font-size:.88rem}
.bar span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:14px;background:var(--tool);border-radius:999px;overflow:hidden}
.bar .fillb{height:100%;background:var(--a1);border-radius:999px}
.texts{max-height:220px;overflow:auto;display:grid;gap:4px;margin-top:8px}
.texts div{background:var(--tool);border-radius:8px;padding:6px 10px;font-size:.9rem}
table.resp{width:100%;border-collapse:collapse;font-size:.88rem}
table.resp th,table.resp td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
.sharebox{display:flex;gap:8px;flex-wrap:wrap}
.sharebox input{flex:1;min-width:220px;height:42px;border:1px solid var(--rule);border-radius:10px;padding:0 12px;background:var(--tool);font:600 .9rem ui-monospace,Menlo,monospace}
.mylist{display:grid;gap:8px}
.mylist a{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.mylist a:hover{background:var(--hover)}
.mylist small{color:var(--soft)}
.center{text-align:center}
</style>
